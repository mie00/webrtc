name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Or your primary branch, e.g., master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Specify your project's Node.js version (e.g., 18, 20)
          cache: 'npm' # Use 'yarn' if you use Yarn

      # - name: Install system dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y ffmpeg qrencode imagemagick

      - name: Install dependencies
        run: npm ci # Use 'yarn install --frozen-lockfile' if you use Yarn

      - name: Run Svelte check
        run: npm run check

      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps # --with-deps installs system dependencies for browsers

      # - name: Run Playwright E2E tests
      #   run: npm run test:e2e:ci

      - name: Build project
        run: npm run build # This command should trigger your Vite build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Path to the directory to upload (Vite builds to 'docs' as per your vite.config.js)
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
