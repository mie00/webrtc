name: CI, Deploy Site, and Release Apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*' # Triggers app builds
  pull_request:
    branches:
      - main # Triggers CI checks

permissions:
  contents: read # Sufficient for checkout and artifact upload
  pages: write    # For GitHub Pages deployment
  id-token: write # For GitHub Pages deployment

jobs:
  ci_checks_and_site_build:
    name: CI Checks & Vite Site Build
    runs-on: ubuntu-latest
    # Run on PRs to main, or direct pushes to main
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm lint

      - name: Run Svelte check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      # - name: Install Playwright browsers
      #   run: pnpm exec playwright install --with-deps

      # - name: Run Playwright E2E tests
      #   run: pnpm test:e2e:ci

      - name: Build Vite site
        run: npm run build # Assuming this builds to 'docs' or 'dist'

      - name: Upload Vite site artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-site
          path: docs # Adjust if your build output is different (e.g., dist)
          if-no-files-found: error

  deploy_site_to_pages:
    name: Deploy Site to GitHub Pages
    runs-on: ubuntu-latest
    needs: ci_checks_and_site_build # Ensure build and tests pass before deploying
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Only deploy on merge/push to main
    permissions: # Job-specific permissions
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Vite site artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-site
          path: ./docs # Download to a 'docs' directory

      - name: Upload Pages artifact for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build_electron_apps:
    name: Build Electron App (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v') # Only run on new tags like v1.0.0
    strategy:
      fail-fast: false # Allow other OS builds to continue if one fails
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
            build_target: linux
            artifact_name: linux-app
            artifact_path: build_dir/app/*.AppImage
          - os: macos-latest
            os_name: macOS
            build_target: mac
            artifact_name: macos-app
            artifact_path: build_dir/app/*.dmg
          - os: windows-latest
            os_name: Windows
            build_target: win
            artifact_name: windows-app
            artifact_path: build_dir/app/* Setup *.exe # Catches 'AppName Setup X.Y.Z.exe'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Linux dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libnss3-dev libxtst-dev libxss1 libasound2t64 xvfb \
            libsecret-1-dev libgbm-dev libopenh264-7

      - name: Install dependencies
        run: pnpm install

      - name: Build Electron app for ${{ matrix.os_name }}
        run: pnpm electron:build -- --${{ matrix.build_target }}

      - name: Upload ${{ matrix.os_name }} App
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
